# Data Steward Claw —— 独立 Data Platform
#
# 内存约束（R0 实测）：开发机 8GB。完整栈无法同时运行。
# 因此按 profile 分组，按需启动：
#
#   docker compose --profile core up -d          # MinIO + Iceberg REST + Trino  （~3GB）
#   docker compose --profile governance up -d    # OpenMetadata + ES + MySQL     （~4.5GB）
#   docker compose --profile obs up -d           # Phoenix                        （~0.5GB）
#
# core 与 governance 不要同时启动。

name: datalaker

services:
  # ---------------- core：数据平面 ----------------
  minio:
    image: minio/minio:latest
    profiles: [core]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
    healthcheck:
      # 注意：`mc ready` 在旧版 minio 镜像中不存在，会让 depends_on 永久卡住
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 12

  # 创建 lake bucket。Agent 的唯一写目标（readme 第 8 节：写权限单向）
  minio_init:
    # 必须用 mc 客户端镜像 —— minio server 镜像里没有 mc
    image: minio/mc:latest
    profiles: [core]
    depends_on: {minio: {condition: service_healthy}}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 admin password &&
      mc mb -p local/lake local/media &&
      echo 'buckets ready'"

  iceberg_rest:
    image: apache/iceberg-rest-fixture:latest
    profiles: [core]
    depends_on: [minio]
    ports: ["8181:8181"]
    environment:
      CATALOG_WAREHOUSE: s3://lake/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1

  trino:
    image: trinodb/trino:latest
    profiles: [core]
    depends_on: [iceberg_rest]
    # 8080 明文端口**不映射到宿主机** —— allow-insecure-over-http 让它免认证，
    # 那是给容器内健康检查与运维脚本用的。对外只暴露需要认证的 HTTPS。
    expose: ["8080"]
    ports: ["8443:8443"]
    # 8GB 机器上限制 JVM，默认配置会吃掉大部分内存
    environment:
      # 8GB 机器上限制 JVM，默认配置会吃掉大部分内存
      JAVA_TOOL_OPTIONS: "-Xmx1G"
      SOURCE_RO_PASSWORD: ${SOURCE_RO_PASSWORD:-ro_pass}
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
      # 平台安全基线（readme R3）：TLS -> 认证 -> 授权
      - ./trino/etc/config.properties:/etc/trino/config.properties:ro
      - ./trino/etc/password-authenticator.properties:/etc/trino/password-authenticator.properties:ro
      - ./trino/etc/access-control.properties:/etc/trino/access-control.properties:ro
      - ./trino/etc/rules.json:/etc/trino/rules.json:ro
      - ./trino/etc/password.db:/etc/trino/password.db:ro
      - ./trino/certs:/etc/trino/certs:ro

  # 源系统模拟：注入脏数据的 Olist（readme 第 15 节）
  source_pg:
    image: postgres:15-alpine
    profiles: [core, source, agent]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: olist
    ports: ["5432:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 12

  # ---------------- obs：可观测性 ----------------
  # 起来之后把 OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317 给到进程，
  # `services/tracing.py` 才开始上报；不给这个变量就是彻底的 no-op。
  # 实测与 core 同开占用 +0.4GB，两组可以并存（governance 那条限制不适用于它）。
  phoenix:
    image: arizephoenix/phoenix:latest
    profiles: [obs]
    ports: ["6006:6006", "4317:4317"]    # 6006=UI/REST  4317=OTLP gRPC

  # ---------------- mail 模拟平面（P2 eval 用，不是生产通道） ----------------
  # GreenMail：SMTP+IMAP 一体的测试邮件服务器。选它不选 Mailpit 的原因：
  # Hermes 的 email adapter 只会 IMAP 轮询，Mailpit 没有 IMAP。
  # auth.disabled = 任意登录成立、收件人即建 —— 10 个 persona 不用建账号；
  # 也因此它**只绑 127.0.0.1**，绝不能挂公网。实测 JVM 压到 -Xmx128m 能起。
  greenmail:
    image: greenmail/standalone:2.1.0
    profiles: [mail]
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
      JAVA_OPTS: -Xmx128m
    ports:
      - "127.0.0.1:3025:3025"    # SMTP 明文（模拟环境专用）
      - "127.0.0.1:3143:3143"    # IMAP 明文（Hermes 侧 EMAIL_IMAP_SECURITY=plain）
    restart: unless-stopped

  # ---------------- agent 平面 ----------------
  # 两个服务，两个数据库账号 —— CLAUDE.md 铁律 2。
  # 同一个容器跑两个角色，「独立进程 + 独立账号」就退化成了自觉。

  approval-callback:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: callback
    image: datalaker/callback:dev
    profiles: [agent]
    depends_on: {source_pg: {condition: service_healthy}}
    environment:
      # approver_role：唯一能写 decisions 的身份
      DATASTEWARD_DSN: postgresql://approver_role:approver_pass@source_pg:5432/steward
      DATASTEWARD_TOKEN_SECRET: ${DATASTEWARD_TOKEN_SECRET:?必须设置}
      APPROVAL_PORT: 8787
      # callback 也要能发回执（readme 10.6）
      NOTIFY_CHANNEL: ${NOTIFY_CHANNEL:-email}
      FEISHU_WEBHOOK: ${FEISHU_WEBHOOK:-}
      WECOM_WEBHOOK: ${WECOM_WEBHOOK:-}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-smtp}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    ports: ["8787:8787"]
    restart: unless-stopped

  # 把内网的 approval-callback 安全暴露到公网（readme 13.2）
  # 出站连接，不需要公网 IP、不开防火墙端口；自带 HTTPS 与域名
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    depends_on: [approval-callback]
    # 注意：不能用 ${VAR:?} —— compose 会解析整个文件，
    # 未激活 profile 的必需变量同样会阻塞其他 profile 启动
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped

  # 定时驱动器：超时升级与周报。**独立于 Agent** —— Agent 挂了催办也不能停
  # 定时循环已交给 Hermes 的 cron（.hermes/plugins/data-steward/cron.py，重排 M4）。
  # 这个服务保留是为了「不跑 Hermes 也能催办」的过渡场景，
  # 起它必须带 CLAW_STANDALONE_SCHEDULER=1 —— 否则容器起来就自己退出。
  # **两边同时开会双份点火**：催办邮件发两遍。M7 目录搬迁时删掉。
  scheduler:
    image: datalaker/callback:dev
    profiles: [agent]
    depends_on: {source_pg: {condition: service_healthy}}
    environment:
      DATASTEWARD_DSN: postgresql://agent_role:agent_pass@source_pg:5432/steward
      DATASTEWARD_TOKEN_SECRET: ${DATASTEWARD_TOKEN_SECRET:?必须设置}
      APPROVAL_BASE_URL: ${APPROVAL_BASE_URL:-http://127.0.0.1:8787}
      NOTIFY_CHANNEL: ${NOTIFY_CHANNEL:-email}
      FEISHU_WEBHOOK: ${FEISHU_WEBHOOK:-}
      WECOM_WEBHOOK: ${WECOM_WEBHOOK:-}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-smtp}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_SPONSOR: ${MAIL_SPONSOR:-}
      MAIL_OWNER: ${MAIL_OWNER:-}
      MAIL_STEWARD: ${MAIL_STEWARD:-}
      # 催办与周报同样是「对外说话」，手动模式下一并扣住等人放行
      MANUAL_MODE: ${MANUAL_MODE:-}
      SCHEDULER_STATE: /app/state/scheduler.json
      ESCALATE_INTERVAL_SEC: ${ESCALATE_INTERVAL_SEC:-3600}
      CLAW_STANDALONE_SCHEDULER: ${CLAW_STANDALONE_SCHEDULER:-0}
    volumes:
      - ../ops:/app/ops
      - ../plugins:/app/plugins
      - ../services:/app/services
      # 恢复器要 import 各条 Pipeline 才知道怎么把任务往下推
      # （`runs.RUNNERS` 是导入时注册的）。少挂这一个目录，
      # `ops/resume.py` 每分钟失败一次而 scheduler 本身看着还活着。
      - ../pipelines:/app/pipelines
      - scheduler_state:/app/state
    command: python /app/ops/scheduler.py
    # **不能是 unless-stopped。** 没设 CLAW_STANDALONE_SCHEDULER 时脚本
    # 打印一句就 exit 0，unless-stopped 会把它无限拉起 —— 实测就是
    # `Restarting (0) Less than a second ago` 一直转。
    # on-failure：正常退出（已交给 Hermes cron）就安静停着。
    restart: on-failure

  steward-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: agent
    image: datalaker/agent:dev
    profiles: [agent]
    depends_on:
      source_pg: {condition: service_healthy}
      approval-callback: {condition: service_started}
    environment:
      # agent_role：对 decisions 只有 SELECT，写不了决定
      DATASTEWARD_DSN: postgresql://agent_role:agent_pass@source_pg:5432/steward
      DATASTEWARD_TOKEN_SECRET: ${DATASTEWARD_TOKEN_SECRET:?必须设置}
      SOURCE_DSN: postgresql://agent_ro:ro_pass@source_pg:5432/olist
      APPROVAL_BASE_URL: ${APPROVAL_BASE_URL:-http://127.0.0.1:8787}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:?}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?}
      OPENAI_MODEL: ${OPENAI_MODEL:-qwen3.7-plus}
      OPENAI_MODEL_FALLBACKS: ${OPENAI_MODEL_FALLBACKS:-}
      DASHSCOPE_FREE_ONLY: ${DASHSCOPE_FREE_ONLY:-true}
      DASHSCOPE_MODEL_EXPIRATIONS: ${DASHSCOPE_MODEL_EXPIRATIONS:-}
      NOTIFY_CHANNEL: ${NOTIFY_CHANNEL:-email}
      FEISHU_WEBHOOK: ${FEISHU_WEBHOOK:-}
      WECOM_WEBHOOK: ${WECOM_WEBHOOK:-}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-gmail_api}
      MAIL_OWNER: ${MAIL_OWNER:-}
      MAIL_STEWARD: ${MAIL_STEWARD:-}
      MAIL_SPONSOR: ${MAIL_SPONSOR:-}
      # 手动模式（每个动作与每封对外的信都要人放行）。**必须显式传进来** ——
      # compose 只透传这里列出的变量，漏了它 .env 里设了也不生效，
      # 而那种失败长得像「手动模式没做出来」。
      MANUAL_MODE: ${MANUAL_MODE:-}
      MINIO_ENDPOINT: http://minio:9000
    volumes:
      # 工具白名单：安全主防线（readme 4.6）
      - ./hermes/config.yaml:/root/.hermes/config.yaml:ro
      # 凭证只读挂载，不进镜像
      - ../secrets:/app/secrets:ro
      # 开发期热更新：改代码不用重 build
      - ../plugins:/app/plugins
      - ../services:/app/services
      - ../tests:/app/tests
    restart: unless-stopped

volumes:
  scheduler_state:
  minio_data:
  pg_data:
