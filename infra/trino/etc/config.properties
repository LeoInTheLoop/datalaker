# Trino 平台安全基线（readme R3）
#
# 依赖链：TLS -> 认证 -> 授权。password authenticator **强制要求 HTTPS**，
# 所以三者必须按顺序配，不能跳过 TLS 直接做认证。
coordinator=true
node-scheduler.include-coordinator=true
discovery.uri=http://localhost:8080

# HTTP 仍保留给容器内部健康检查；对外只暴露 HTTPS
http-server.http.enabled=true
http-server.http.port=8080

http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/etc/trino/certs/trino.pem

# 启用认证后，集群内部通信必须有共享密钥（单机也不例外）
internal-communication.shared-secret=lg0lr1YiUDHRK0-sp7RXPlG6l02Li3An4ie_49tXXhw

# 认证：没有它，--user 就是个可以随便填的字符串
http-server.authentication.type=PASSWORD
# 允许容器内 localhost 免认证，供健康检查与本地运维脚本使用
http-server.authentication.allow-insecure-over-http=true
http-server.process-forwarded=true

# 授权：file-based 起步，R4 的 Policy Sync 会换成 OPA
access-control.config-files=/etc/trino/access-control.properties
