# 文件 / SaaS 导出的暂存区（readme 8.2 数据面）。
#
# 它**不是源系统**：邮件附件与导出报表落在这里，再由 sync_table 进 bronze。
# 这样「文件进湖」完全复用数据库那条路的类型映射、水位与 schema 漂移检测，
# 不需要第二套 bronze 写入实现。
# Agent 仍然只读 —— 写入由 ingest 服务用独立账号完成。
connector.name=postgresql
connection-url=jdbc:postgresql://source_pg:5432/stage
connection-user=agent_ro
connection-password=${ENV:SOURCE_RO_PASSWORD}
